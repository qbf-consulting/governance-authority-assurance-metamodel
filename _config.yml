title: Governance, Authority and Assurance Metamodel
description: Protocol-neutral governance semantics for authority, delegation, evidence, assurance and accountable digital trust.
url: https://qbf-consulting.github.io
baseurl: /governance-authority-assurance-metamodel
repository: qbf-consulting/governance-authority-assurance-metamodel
version: 0.9.1
normative_version: 0.9.0
status: Candidate Maintenance Release
theme: just-the-docs
color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
mermaid:
  version: "11.16.0"
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  toc_levels: 2..4
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
aux_links:
  "GAAM on GitHub":
    - "https://github.com/qbf-consulting/governance-authority-assurance-metamodel"
aux_links_new_tab: true
callouts:
  candidate:
    title: Candidate Specification
    color: purple
  normative:
    title: Normative
    color: blue
  informative:
    title: Informative
    color: grey-dk
exclude:
  - README.md
  - requirements-dev.txt
  - package.json
  - package-lock.json
  - node_modules
  - scripts
  - tests
  - validation
  - packages
  - artifacts
  - implementation-reports/fixtures
  - Gemfile.lock
  - vendor
  - .bundle
  - Dockerfile
  - docker-compose.yml
  - examples/README.md
  - examples/authority-lifecycle-and-revocation/README.md
  - examples/basic-governed-decision/README.md
  - examples/cross-registry-recognition/README.md
  - examples/delegated-agent-purchase/README.md
  - examples/governed-ecosystem-operations/README.md
  - examples/high-impact-multi-agent-service/README.md
  - examples/independent-assurance-assessment/README.md
  - examples/machine-actionable-governance-package/README.md
  - examples/notice-challenge-and-remedy/README.md
  - examples/institutional-authority-succession/README.md
  - examples/cross-jurisdiction-policy-conflict/README.md
  - examples/agent-state-change-control/README.md
  - examples/post-decision-obligation-lifecycle/README.md
  - examples/downstream-remedy-propagation/README.md
  - examples/inferred-evidence-governance/README.md
  - examples/degraded-trust-service-operation/README.md
  - examples/assurance-composition/README.md
  - examples/revocation-propagation-boundaries/README.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
      version: "0.9.1"
      release_status: "Candidate Maintenance Release"
