      claim: identity-is-not-authority
    - id: AAC-02
      claim: exact-action-binding
    - id: AAC-03
      claim: authority-at-time-t
    - id: AAC-04
      claim: bounded-scope
    - id: AAC-05
      claim: exact-action-approval-binding
    - id: AAC-06
      claim: fail-safe-indeterminate-authority
