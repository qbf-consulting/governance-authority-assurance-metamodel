name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaam-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate maturity and evidence state
        run: python scripts/build_candidate_readiness.py

      - name: Test maturity authority boundaries
        run: python scripts/test_maturity_model.py

      - name: Run GAAM validation
        run: python scripts/validate.py

      - name: Validate generated maturity state is current
        run: python scripts/build_candidate_readiness.py --check

      - name: Validate guided learning paths
        run: python scripts/validate_learning_paths.py

      - name: Validate clean-room implementation path
        run: python scripts/validate_clean_room.py

      - name: Validate candidate pre-review dossiers
        run: python scripts/validate_pre_review.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install diagram validation dependencies
        run: npm ci

      - name: Validate Mermaid diagrams
        run: npm run validate:mermaid

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch observed 2026-09-07
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build GitHub Pages site
        env:
          JEKYLL_ENV: production
        run: >
          bundle exec jekyll build
          --strict_front_matter
          --trace

      - name: Publish versioned schema mirror
        run: python scripts/publish_versioned_schemas.py

      - name: Validate rendered publication
        run: python scripts/validate_pages.py

      - name: Verify canonical schema mirror bytes
        run: python scripts/verify_canonical_publication.py --site-root _site --output validation/canonical-publication-report.json

      - name: Build reproducible release archive twice
        env:
          SOURCE_DATE_EPOCH: "1787184000"
        run: |
          python scripts/build_release.py
          first=$(sha256sum dist/governance-authority-assurance-metamodel-v0.9.1.zip | cut -d' ' -f1)
          python scripts/build_release.py
          second=$(sha256sum dist/governance-authority-assurance-metamodel-v0.9.1.zip | cut -d' ' -f1)
          test "$first" = "$second"

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gaam-validation-evidence
          path: |
            VALIDATION_REPORT.md
            validation/
            packages/gaam-v0.9.1/checksums.json
            dist/*.release.json
            _site/
